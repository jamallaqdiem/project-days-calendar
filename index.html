<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Calendar</title>
</head>

<body>
    <main>
        <section id="navigation">
            <div class="nav-container"> <button id="prev-btn">Previous</button>
                <h2 id="month-year-display"></h2> <button id="next-btn">Next</button>
            </div>
        </section>

        <section id="selectors">
            <label for="month-select">Month:</label>
            <select id="month-select">
                <option value="0">January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>

            <label for="year-select">Year:</label>
            <select id="year-select"></select>
        </section>

        <section id="weekday-labels">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </section>

        <section id="calendar-grid"></section>
    </main>

    <!-- Modal -->
    <div id="special-day-modal" class="modal">
        <div class="modal-content">
            <h3></h3>
            <p></p>
            <button class="close-btn">Close</button>
        </div>
    </div>

    <script type="module" src="web.mjs"></script>
</body>

</html>
